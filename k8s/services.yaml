{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "headscale"
  },
  "spec": {
    "selector": {
      "app": "headscale"
    },
    "ports": [
      {
        "name": "http",
        "port": 8080,
        "targetPort": "http"
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "headplane"
  },
  "spec": {
    "selector": {
      "app": "headplane"
    },
    "ports": [
      {
        "name": "http",
        "port": 3000,
        "targetPort": "http"
      }
    ]
  }
}
